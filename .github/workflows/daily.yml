name: MLB Bet Builder Diario

on:
  schedule:
    # 17:00 UTC = 11:00 AM hora Ciudad de Mexico (CST) / 12:00 PM en horario
    # de verano. Ajusta la hora segun cuando quieras recibir el mensaje
    # (antes de que empiecen los juegos del dia). Formato: minuto hora * * *
    - cron: "0 17 * * *"
  workflow_dispatch: {}  # te deja correrlo manualmente desde la pestaña Actions

permissions:
  contents: write  # necesario para que el workflow pueda guardar el historial actualizado

jobs:
  run-bet-builder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr bet builder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MAX_GAMES_PER_DAY: "15"
          TIMEZONE: "America/Mexico_City"
        run: python -m src.main

      - name: Guardar historial actualizado en el repo
        run: |
          git config user.name "mlb-bet-builder-bot"
          git config user.email "actions@github.com"
          git add data/picks_history.json data/calibration.json
          git diff --quiet --cached || git commit -m "Actualiza historial y calibracion [skip ci]"
          git push
